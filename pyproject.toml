[project]
name = "nightshift"
version = "0.1.0"
description = "An agent fleet that patches CVEs across hundreds of repositories overnight and repairs the code each upgrade breaks."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Runtime dependencies of the shared domain package only. Each service pins its
# own additional dependencies in services/<name>/requirements.txt so that a
# worker image does not carry the dashboard's API stack, and vice versa.
dependencies = [
    "httpx>=0.27",
    "packaging>=24.0",
    # The cost curve is a query over span attributes, so tracing is part of the
    # domain rather than an operational extra. The SDK stays optional: the module
    # degrades to recording spans in process when it is absent.
    "opentelemetry-api>=1.27",
]

[project.optional-dependencies]
dev = [
    "opentelemetry-sdk>=1.27",
    # google-adk is a *worker* dependency, not a domain one — but the suite
    # asserts that the repair agent is built with exactly the three
    # policy-gated tools, and that assertion is worthless if CI cannot import
    # the package and quietly skips it.
    "google-adk>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "services", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF",
]
ignore = [
    "B008",  # function call in default argument — used deliberately by FastAPI
]

[tool.mypy]
python_version = "3.11"
mypy_path = "packages"
files = ["packages", "services", "scripts", "tests"]
strict = true
warn_unreachable = true
# Third-party packages without stubs. Keep this list short and justified.
[[tool.mypy.overrides]]
module = [
    "google.cloud.*",
    "google.adk.*",
    "google.genai.*",
    "github.*",
    "opentelemetry.exporter.*",
]
ignore_missing_imports = true
